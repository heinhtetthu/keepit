name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · lint, migrations, tests (incl. row-level security)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: records_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/records_test
      RECORDS_TEST_DB: postgresql+asyncpg://postgres:postgres@localhost:5432/records_test
      APP_DB_PASSWORD: ci-disposable-app-role-password
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt ruff==0.14.3
      - run: ruff check app tests --select F401,F811,E9
      - name: Migrations round-trip and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Tests (owner connection)
        run: python -m pytest tests -q
      - name: Tests as the limited keepit_app role with row-level security
        run: python -m pytest tests -q
        env:
          RECORDS_TEST_RLS: "1"
      - run: python ../../scripts/test_backup_format.py

  web:
    name: Web, core & MCP · typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pip install -r apps/api/requirements.txt
      - name: Generated API client matches the OpenAPI schema
        run: pnpm gen:api && git diff --exit-code packages/api-client
      - run: pnpm typecheck
      - run: pnpm --filter web lint
      - run: pnpm --filter @workspace/core test
      - run: pnpm build

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API, web and MCP images
        run: |
          docker build -t keepit-api:ci apps/api
          docker build -f apps/web/Dockerfile -t keepit-web:ci .
          docker build -f apps/mcp/Dockerfile -t keepit-mcp:ci .

name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'   # weekly dependency re-check
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install pip-audit bandit
      - run: pip-audit -r apps/api/requirements.txt
      - run: bandit -r apps/api/app -ll
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - name: Scan tracked content for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan dependency manifests and container configuration
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
  browser:
    runs-on: ubuntu-latest
    env:
      FRONTEND_PORT: '8091'
      FRONTEND_URL: http://host.docker.internal:8091
      CORS_ALLOWED_ORIGINS: http://host.docker.internal:8091
    steps:
      - uses: actions/checkout@v4
      - name: Initialize disposable local configuration
        run: |
          cp .env.example .env
          docker run --rm -v "$PWD:/workspace" -w /workspace python:3.12-slim sh -c 'pip install -q cryptography && python scripts/init-local-security.py'
      - run: docker compose up -d --build postgres backend frontend
      - name: Wait for disposable application
        run: |
          for i in $(seq 1 90); do
            if curl --fail http://localhost:8091/api/v1/health/ready; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: docker compose exec -T backend python -m app.seed
      - name: Confirm the API runs as the limited role with row-level security
        run: |
          docker compose exec -T postgres psql -U postgres -d records -tAc "select count(*) from pg_tables where rowsecurity" | grep -qx 4
          docker compose exec -T postgres psql -U postgres -d records -tAc "select rolsuper::text || rolbypassrls::text from pg_roles where rolname='keepit_app'" | grep -qx falsefalse
      - name: Browser login, refresh, navigation and security checks
        run: |
          docker run --rm --add-host=host.docker.internal:host-gateway -v "$PWD/scripts:/checks:ro" -e SMOKE_BASE_URL=http://host.docker.internal:8091 -e SMOKE_USERNAME=admin -e SMOKE_PASSWORD=admin12345 mcr.microsoft.com/playwright:v1.49.1-noble sh -c 'cd /tmp && npm install --silent playwright@1.49.1 && NODE_PATH=/tmp/node_modules node /checks/smoke-session.cjs && NODE_PATH=/tmp/node_modules node /checks/smoke-security.cjs && NODE_PATH=/tmp/node_modules node /checks/smoke-recovery-flows.cjs'
      - if: always()
        run: docker compose down -v

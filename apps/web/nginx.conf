log_format renewly_safe '$remote_addr [$time_local] "$request_method $uri" $status';
access_log /var/log/nginx/access.log renewly_safe;

server {
    include /etc/nginx/security-headers.conf;
    listen 8080;
    client_max_body_size 12m;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable - cache them forever.
    location /_app/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # index.html (and SPA fallbacks) must always revalidate, otherwise browsers
    # keep serving a stale bundle referencing JS files that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://backend:8000;
    }

    location /openapi.json {
        proxy_pass http://backend:8000;
    }
}
